[package]
name = "mc2engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mc2cli"
path = "src/bin/cli.rs"

[[bin]]
name = "cputest"
path = "src/bin/cputest.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

# Differential CPU tester (tools/cputest): release codegen, but unwinding so a
# panicking instruction is reported instead of aborting the whole batch.
[profile.cputest]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
